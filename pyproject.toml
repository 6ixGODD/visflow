[build-system]
build-backend = "poetry.core.masonry.api"

requires = [ "poetry-core>=2,<3" ]

[project]
name = "visflow"
version = "1.0.5"
description = "A comprehensive computer vision framework for training, evaluation, and visualization with support for multiple architectures and GradCAM analysis"
readme = "README.md"
keywords = [ "computer vision", "deep learning", "gradcam", "machine learning", "neural networks", "pytorch" ]
license = { text = "MIT" }
authors = [
  { name = "BoChen SHEN", email = "6goddddddd@gmail.com" },
]
requires-python = ">=3.11,<=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "grad-cam>=1.5.5,<2",
  "halo>=0.0.31,<0.0.32",
  "httpx>=0.28.1,<0.29",
  "matplotlib>=3.10.6,<4",
  "numpy>=2.3.2,<3",
  "onnx>=1.19,<2",
  "onnxruntime>=1.22.1,<2",
  "psutil>=7,<8",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "pyfiglet>=1.0.4,<2",
  "pyyaml>=6.0.2,<7",
  "rich>=14.1,<15",
  "scikit-learn>=1.7.1,<2",
  "seaborn>=0.13.2,<0.14",
  "tenacity>=9.1.2,<10",
  "torch>=2.3,<3",
  "torchvision>=0.23,<0.24",
  "tqdm>=4.67.1,<5",
]

optional-dependencies.dev = [ "pre-commit>=4.4,<5", "pylint>=3.3.8,<4", "ruff>=0.14.6,<0.15" ]
optional-dependencies.test = [
  "mypy>=1.18.1,<2",
  "pylint>=3.3.8,<4",
  "pytest>=7",
  "pytest-cov>=4",
  "types-pyyaml>=6.0.12.20250915,<7",
]
urls.Documentation = "https://6ixgodd.github.io/visflow"
urls.Homepage = "https://github.com/6ixGODD/visflow"
urls.Repository = "https://github.com/6ixGODD/visflow"
scripts.visflow = "visflow.cli:main"
homepage = "https://github.com/6ixGODD/visflow"
repository = "https://github.com/6ixGODD/visflow"

[tool.poetry.scripts]
visflow = "visflow.cli.main:main"
